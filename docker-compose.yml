services:
  lotusd:
    image: boblepointu/lotused:latest
    container_name: lotusd
    restart: unless-stopped

    ports:
      # P2P mainnet — other nodes connect here to sync the blockchain
      - "10605:10605"

      # RPC + REST API — JSON-RPC on /  and REST API on /api/v1/
      # Bind to 127.0.0.1 to keep it local-only; remove the IP to expose publicly
      - "127.0.0.1:10604:10604"

    volumes:
      # Persistent chain data (blocks, indexes, SQLite DBs, module DBs)
      - lotusd-data:/data

    command:
      - -datadir=/data
      - -printtoconsole

      # ── Network ──────────────────────────────────────────────────
      - -listen=1
      - -dnsseed=1
      - -addnode=seed.lotusia.org

      # ── RPC / API ───────────────────────────────────────────────
      - -rpcuser=lotus
      - -rpcpassword=CHANGE_ME_TO_SOMETHING_RANDOM
      - -rpcbind=0.0.0.0:10604
      - -rpcallowip=0.0.0.0/0
      - -rpcthreads=4

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  lotusd-data:
