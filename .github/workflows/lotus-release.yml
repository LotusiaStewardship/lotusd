name: 🚀 Lotus Release

on:
  workflow_call:
    inputs:
      version:
        description: "The version to package and release"
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: write
  packages: write

jobs:
  collect-and-publish:
    name: 🎁 Collect Artifacts & Publish Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./incoming
          merge-multiple: false

      - name: Flatten artifacts
        run: |
          mkdir -p ./release-packages
          # download-artifact creates one subdirectory per artifact name; we
          # flatten the inner files into a single release-packages/ folder.
          find ./incoming -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec cp -v {} ./release-packages/ \;
          echo "Collected files:"
          ls -la ./release-packages/

      - name: Build combined per-OS/arch packages
        run: |
          set -e
          cd ./release-packages
          VERSION="${{ inputs.version }}"

          # Discover (os, arch) pairs from the per-component archives.
          mapfile -t pairs < <(ls lotus-node-${VERSION}-*.tar.gz 2>/dev/null \
            | sed -E "s/^lotus-node-${VERSION}-([^.]+)\\.tar\\.gz$/\\1/" \
            | sort -u)

          for pair in "${pairs[@]}"; do
            OS="${pair%-*}"
            ARCH="${pair##*-}"
            COMBO="lotus-binaries-${VERSION}-${pair}"
            mkdir -p "${COMBO}"
            for COMP in node cli tx seeder wallet qt; do
              SRC="lotus-${COMP}-${VERSION}-${pair}.tar.gz"
              if [ -f "$SRC" ]; then
                tar -xzf "$SRC" -C "${COMBO}" --strip-components=1
              fi
            done
            if [ -n "$(ls -A "${COMBO}" 2>/dev/null)" ]; then
              tar -czf "${COMBO}.tar.gz" "${COMBO}"
              zip -r "${COMBO}.zip"  "${COMBO}"
            fi
            rm -rf "${COMBO}"
          done

          echo "Final release packages:"
          ls -la

      - name: Set repository owner (lowercase)
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Resolve release tag
        id: resolve-tag
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          # The release pipeline only runs on version tags, so the tag
          # already exists. Prefer the bare "X.Y.Z" tag if present, else
          # fall back to the "vX.Y.Z" form.
          if git ls-remote --tags origin | grep -q "refs/tags/${VERSION}$"; then
            TAG="${VERSION}"
          elif git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            TAG="v${VERSION}"
          else
            echo "::error::No tag matching ${VERSION} or v${VERSION} on origin"
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: ${TAG}"

      - name: Generate release notes
        id: notes
        run: |
          set -e
          VERSION="${{ inputs.version }}"
          REPO_OWNER_LC="${REPO_OWNER_LC}"
          REPO="${GITHUB_REPOSITORY}"
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude="v${VERSION}" 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s by %an" -20)
            COMPARE_LINK=""
          else
            CHANGELOG=$(git log --pretty=format:"- %s by %an" "${PREV_TAG}..HEAD")
            COMPARE_LINK="[View all changes](https://github.com/${REPO}/compare/${PREV_TAG}...v${VERSION})"
          fi

          # Discover (os, arch) pairs from the produced archives.
          cd release-packages
          mapfile -t pairs < <(ls lotus-node-${VERSION}-*.tar.gz lotus-node-${VERSION}-*.zip 2>/dev/null \
            | sed -E "s/^lotus-node-${VERSION}-([^.]+)\\.(tar\\.gz|zip)$/\\1/" \
            | sort -u)
          cd ..

          combined_section=""
          per_comp_section=""
          for pair in "${pairs[@]}"; do
            label="${pair}"
            tgz="https://github.com/${REPO}/releases/download/v${VERSION}/lotus-binaries-${VERSION}-${pair}.tar.gz"
            zip="https://github.com/${REPO}/releases/download/v${VERSION}/lotus-binaries-${VERSION}-${pair}.zip"
            combined_section+=$'\n'"* \`${label}\` — [tar.gz](${tgz}) · [zip](${zip})"
          done

          for COMP in node cli tx seeder wallet qt gpu-miner-nvidia gpu-miner-amd; do
            label_pretty=$(echo "$COMP" | sed 's/-/ /g')
            per_comp_section+=$'\n'"#### Lotus ${label_pretty^}"
            for pair in "${pairs[@]}"; do
              tgz="https://github.com/${REPO}/releases/download/v${VERSION}/lotus-${COMP}-${VERSION}-${pair}.tar.gz"
              zip="https://github.com/${REPO}/releases/download/v${VERSION}/lotus-${COMP}-${VERSION}-${pair}.zip"
              per_comp_section+=$'\n'"* \`${pair}\` — [tar.gz](${tgz}) · [zip](${zip})"
            done
            per_comp_section+=$'\n'
          done

          cat > release_notes.md <<EOF
          # 🚀 Lotus Root v${VERSION} Release

          ![Lotus Logo](https://raw.githubusercontent.com/${REPO}/master/share/pixmaps/lotus64.png)

          ## 📦 Binaries and Docker Images

          ### Combined Packages (all components per OS/arch)
          ${combined_section}

          ### Individual Component Packages
          ${per_comp_section}

          ### Docker Images
          Multi-arch manifests (\`linux/amd64\`, \`linux/arm64\`, \`linux/arm/v7\`, \`linux/386\` where supported):
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-node:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-node) — Main Lotus daemon
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-cli:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-cli) — Command-line interface
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-seeder:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-seeder) — Network seeder
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-tx:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-tx) — Transaction utility
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-wallet:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-wallet) — Wallet utility
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-qt:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-qt) — Desktop GUI wallet
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-gpu-miner:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-gpu-miner) — GPU Miner (NVIDIA, amd64+arm64)
          * [\`ghcr.io/${REPO_OWNER_LC}/lotus-gpu-miner-amd:${VERSION}\`](https://github.com/${REPO}/pkgs/container/lotus-gpu-miner-amd) — GPU Miner (AMD ROCm, amd64)

          ## 🔍 What's Changed

          ${COMPARE_LINK}

          ### Changelog
          ${CHANGELOG}

          ## 💡 Installation Instructions

          ### Docker Installation
          \`\`\`bash
          # Pull the Lotus node image (Docker selects the right arch automatically)
          docker pull ghcr.io/${REPO_OWNER_LC}/lotus-node:${VERSION}

          # Run a Lotus node
          docker run -d --name lotus-node \\
            -p 10605:10605 -p 10604:10604 \\
            -v lotus-data:/root/.lotus \\
            ghcr.io/${REPO_OWNER_LC}/lotus-node:${VERSION}
          \`\`\`

          ### Linux Binary Installation
          \`\`\`bash
          # Replace <arch> with one of: amd64, arm64, armv7, i386
          ARCH=amd64
          wget https://github.com/${REPO}/releases/download/v${VERSION}/lotus-node-${VERSION}-linux-\${ARCH}.tar.gz
          tar -xzf lotus-node-${VERSION}-linux-\${ARCH}.tar.gz
          cd lotus-node-${VERSION}-linux-\${ARCH}
          ./lotusd -printtoconsole
          \`\`\`

          ### Windows Binary Installation
          1. Download \`lotus-node-${VERSION}-windows-amd64.zip\` from the assets above.
          2. Unzip into a folder of your choice.
          3. Open a PowerShell prompt in that folder and run \`./lotusd.exe -printtoconsole\`.

          ### macOS Binary Installation
          \`\`\`bash
          # x86_64 Macs and Apple Silicon (via Rosetta 2 if needed)
          ARCH=x86_64   # or arm64
          wget https://github.com/${REPO}/releases/download/v${VERSION}/lotus-node-${VERSION}-macos-\${ARCH}.tar.gz
          tar -xzf lotus-node-${VERSION}-macos-\${ARCH}.tar.gz
          cd lotus-node-${VERSION}-macos-\${ARCH}
          xattr -d com.apple.quarantine ./lotusd 2>/dev/null || true
          ./lotusd -printtoconsole
          \`\`\`

          ### GPU Miner Installation
          \`\`\`bash
          ARCH=amd64   # or arm64 for NVIDIA Jetson
          wget https://github.com/${REPO}/releases/download/v${VERSION}/lotus-gpu-miner-nvidia-${VERSION}-linux-\${ARCH}.tar.gz
          tar -xzf lotus-gpu-miner-nvidia-${VERSION}-linux-\${ARCH}.tar.gz
          cd lotus-gpu-miner-nvidia-${VERSION}-linux-\${ARCH}
          chmod +x lotus-miner-cli
          ./lotus-miner-cli -g 0 -s 27 -o YOUR_LOTUS_ADDRESS -i 1 -a https://burnlotus.org -m
          \`\`\`

          ## 📋 System Requirements
          - **OS**: Ubuntu 22.04+, Debian 11+, Windows 10+, macOS 11+ (x86_64 or Apple Silicon)
          - **Architectures**: x86_64 (amd64) · ARM64 (aarch64) · ARMv7 (32-bit ARM) · i386 (32-bit x86, Linux only)
          - **RAM**: 4 GB min, 8 GB recommended
          - **Storage**: 16 GB min, SSD recommended
          - **GPU Mining**: NVIDIA GPU with CUDA support, or AMD GPU with OpenCL/ROCm

          ## 🔗 Additional Resources
          - [Official Website](https://lotusia.org)
          - [Documentation](https://docs.lotusia.org)
          - [GitHub Repository](https://github.com/${REPO})
          - [Issue Tracker](https://github.com/${REPO}/issues)

          ---
          *This release was automatically generated by the Lotus CI system on $(date -u "+%Y-%m-%d").*
          EOF

          {
            echo "release_notes<<__EOF_NOTES__"
            cat release_notes.md
            echo "__EOF_NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve-tag.outputs.tag }}
          name: Lotus Root v${{ inputs.version }}
          body: ${{ steps.notes.outputs.release_notes }}
          files: |
            ./release-packages/lotus-binaries-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-binaries-${{ inputs.version }}-*.zip
            ./release-packages/lotus-node-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-node-${{ inputs.version }}-*.zip
            ./release-packages/lotus-cli-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-cli-${{ inputs.version }}-*.zip
            ./release-packages/lotus-tx-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-tx-${{ inputs.version }}-*.zip
            ./release-packages/lotus-seeder-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-seeder-${{ inputs.version }}-*.zip
            ./release-packages/lotus-wallet-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-wallet-${{ inputs.version }}-*.zip
            ./release-packages/lotus-qt-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-qt-${{ inputs.version }}-*.zip
            ./release-packages/lotus-gpu-miner-nvidia-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-gpu-miner-nvidia-${{ inputs.version }}-*.zip
            ./release-packages/lotus-gpu-miner-amd-${{ inputs.version }}-*.tar.gz
            ./release-packages/lotus-gpu-miner-amd-${{ inputs.version }}-*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
