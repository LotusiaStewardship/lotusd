name: 🌸 Lotus Main CI

# Two distinct trigger modes:
#
#   1. Full release pipeline (Linux + Windows + macOS + Docker + GPU
#      miner + GitHub release): runs only on a version tag pushed to
#      master / main, where the tag name is "XX.YY.ZZ" or "vXX.YY.ZZ".
#
#   2. Dev build (Linux only, no release): runs on every push to any
#      branch and on pull requests. Artifacts are uploaded but no tag
#      or GitHub release is created. Intended for "dev" branches and
#      open pull requests.
#
# Manual runs via workflow_dispatch can opt into the full pipeline
# regardless of the trigger context.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

on:
  push:
    branches: [ '**' ]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: "Run the full multi-OS pipeline (release-grade)"
        type: boolean
        default: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  packages: write

jobs:
  # Decide what kind of run this is.
  classify:
    name: 🧭 Classify run
    runs-on: ubuntu-22.04
    outputs:
      is_release: ${{ steps.set.outputs.is_release }}
      is_dev: ${{ steps.set.outputs.is_dev }}
    steps:
      - id: set
        run: |
          set -e
          IS_RELEASE=false
          IS_DEV=false
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag must look like a version (with or without leading v).
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IS_RELEASE=true
            fi
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.full_pipeline }}" == "true" ]]; then
            IS_RELEASE=true
          fi
          if [[ "$IS_RELEASE" == "false" ]]; then
            IS_DEV=true
          fi
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "is_dev=$IS_DEV"         >> "$GITHUB_OUTPUT"
          echo "Run classification: release=$IS_RELEASE dev=$IS_DEV"

  version-management:
    name: 📊 Version Management
    needs: [ classify ]
    uses: ./.github/workflows/lotus-version-management.yml
    secrets: inherit

  # ---------------------------------------------------------------------
  # Dev build: Linux only, runs on every branch / PR.
  # ---------------------------------------------------------------------
  build-linux:
    name: 🐧 Linux Builds
    needs: [ classify, version-management ]
    if: always() && needs.version-management.result == 'success'
    uses: ./.github/workflows/lotus-build-linux.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit

  # ---------------------------------------------------------------------
  # Release-only legs: Windows, macOS, Docker manifests, GPU miner,
  # GitHub release. Skipped on plain branch pushes / PRs.
  # ---------------------------------------------------------------------
  build-windows:
    name: 🪟 Windows Builds
    needs: [ classify, version-management ]
    if: needs.classify.outputs.is_release == 'true'
    uses: ./.github/workflows/lotus-build-windows.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit

  build-macos:
    name: 🍎 macOS Builds
    needs: [ classify, version-management ]
    if: needs.classify.outputs.is_release == 'true'
    uses: ./.github/workflows/lotus-build-macos.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit

  build-docker:
    name: 🐳 Docker Multi-arch
    needs: [ classify, version-management ]
    if: needs.classify.outputs.is_release == 'true'
    uses: ./.github/workflows/lotus-build-docker.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit

  build-gpu-miner:
    name: ⛏️  GPU Miner
    needs: [ classify, version-management ]
    if: needs.classify.outputs.is_release == 'true'
    uses: ./.github/workflows/lotus-build-gpu-miner.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit

  release:
    name: 🚀 Release
    needs: [ classify, version-management, build-linux, build-windows, build-macos, build-docker, build-gpu-miner ]
    if: |
      always()
      && needs.classify.outputs.is_release == 'true'
      && needs.build-linux.result    == 'success'
      && needs.build-docker.result   == 'success'
      && needs.build-gpu-miner.result == 'success'
      && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped')
      && (needs.build-macos.result   == 'success' || needs.build-macos.result   == 'skipped')
    uses: ./.github/workflows/lotus-release.yml
    with:
      version: ${{ needs.version-management.outputs.version }}
    secrets: inherit
