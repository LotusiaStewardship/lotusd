name: CI

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends yamllint

      - name: YAML lint (workflows and configs)
        run: yamllint .

      - name: Shell syntax check
        run: |
          find . -name '*.sh' -type f -exec sh -n {} \;

      - name: Python syntax check
        run: |
          find . -name '*.py' -type f -exec python3 -m py_compile {} \;

      - name: Check for trailing whitespace in diff
        run: |
          if ! git diff --check HEAD~1 2>/dev/null; then
            echo "::warning::Trailing whitespace found - run 'git diff --check' locally"
          fi

      - name: Circular dependencies check
        run: test/lint/lint-circular-dependencies.sh

      - name: Test suite naming check
        run: test/lint/lint-tests.sh

  dockerfile-check:
    name: Dockerfile syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfile.lotus
        run: |
          # BuildKit --check validates Dockerfile syntax without building
          docker buildx build --check -f dockerfiles/Dockerfile.lotus . 2>&1
          echo "::notice::Dockerfile.lotus: syntax OK"

      - name: Validate Dockerfile.lotus-qt
        run: |
          docker buildx build --check -f dockerfiles/Dockerfile.lotus-qt . 2>&1
          echo "::notice::Dockerfile.lotus-qt: syntax OK"

      - name: Validate Dockerfile.lotus.win64
        run: |
          docker buildx build --check -f dockerfiles/Dockerfile.lotus.win64 . 2>&1
          echo "::notice::Dockerfile.lotus.win64: syntax OK"

      - name: Validate Dockerfile.lotus.osx
        run: |
          docker buildx build --check -f dockerfiles/Dockerfile.lotus.osx . 2>&1
          echo "::notice::Dockerfile.lotus.osx: syntax OK"
