name: Build

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 11.5.0)"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build-lotus:
    name: Build lotus core
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: owner
        name: Set repository owner (lowercase)
        run: |
          REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}
          echo "REPO_OWNER_LC=$REPO_OWNER_LC" >> $GITHUB_OUTPUT
          echo "REPO_OWNER_LC=$REPO_OWNER_LC" >> $GITHUB_ENV

      - id: version
        name: Extract version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION=${{ inputs.version }}
          else
            VERSION=${GITHUB_REF_NAME#v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build and push lotus Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.lotus
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus:latest

      - name: Build and push lotus-qt Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.lotus-qt
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus-qt:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus-qt:latest

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: Extract lotus core binaries
        run: |
          container_id=$(docker create ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus:${{ steps.version.outputs.VERSION }})
          docker cp $container_id:/opt/lotus/bin/. artifacts/
          docker rm $container_id

      - name: Extract lotus-qt binary
        run: |
          container_id=$(docker create ghcr.io/${{ steps.owner.outputs.REPO_OWNER_LC }}/lotus-qt:${{ steps.version.outputs.VERSION }})
          docker cp $container_id:/opt/lotus/bin/lotus-qt artifacts/
          docker rm $container_id

      - name: Package lotus core
        run: |
          cd artifacts
          tar -czvf ../lotus-$VERSION-linux-x86_64.tar.gz \
            lotusd lotus-cli lotus-tx lotus-wallet lotus-seeder

      - name: Package lotus-qt
        run: |
          cd artifacts
          tar -czvf ../lotus-qt-$VERSION-linux-x86_64.tar.gz lotus-qt

      - name: Generate release notes
        run: |
          prev_tag=$(git describe --tags --abbrev=0 --exclude="v${VERSION}" 2>/dev/null || echo "")
          if [ -z "$prev_tag" ]; then
            changelog=$(git log --pretty=format:"- %s" -20)
          else
            changelog=$(git log --pretty=format:"- %s" ${prev_tag}..HEAD)
          fi

          cat > release_notes.md <<-EOF
          ## Lotus v$VERSION

          This release brings the latest improvements to the Lotus daemon, command-line tools,
          and desktop GUI wallet.

          ### What's Changed
          ${changelog}

          ### Docker Images
          - \`ghcr.io/$REPO_OWNER_LC/lotus:$VERSION\` — lotus daemon and CLI tools (lotusd, lotus-cli, lotus-tx, lotus-wallet, lotus-seeder)
          - \`ghcr.io/$REPO_OWNER_LC/lotus-qt:$VERSION\` — desktop GUI wallet

          ### Binary Packages
          - \`lotus-$VERSION-linux-x86_64.tar.gz\` — core binaries
          - \`lotus-qt-$VERSION-linux-x86_64.tar.gz\` — desktop GUI wallet

          ### Installing
          Pull the Docker image, or download the tarball for your platform, extract it, and run \`./lotusd\`.
          See the [repository README](https://github.com/${{ github.repository }}) for detailed instructions.
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: Lotus v${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            lotus-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
            lotus-qt-${{ steps.version.outputs.VERSION }}-linux-x86_64.tar.gz
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: false
