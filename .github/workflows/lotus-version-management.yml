name: 📊 Lotus Version Resolver

# Versioning policy for the LotusDevOrg fork:
#
#   * Releases are cut by pushing a tag named "XX.YY.ZZ" (or "vXX.YY.ZZ")
#     to master / main. The tag value IS the release version.
#
#   * For dev builds (any branch / PR) the version reported is
#     "<cmakelists-version>-dev-<short-sha>", e.g. "11.0.0-dev-ac7cec4".
#     This is only used as an artifact label - no GitHub release, no
#     Docker push, no tag.
#
#   * MAJOR / MINOR / PATCH bumps are intentionally manual: edit
#     CMakeLists.txt + contrib/aur/lotus/PKGBUILD and tag the resulting
#     commit. There is no auto-bump and no auto-revert.

on:
  workflow_call:
    outputs:
      version:
        description: "Resolved version string (tag name on tag pushes, dev-suffixed otherwise)"
        value: ${{ jobs.resolve.outputs.version }}
      cmake_version:
        description: "Raw VERSION value found in CMakeLists.txt"
        value: ${{ jobs.resolve.outputs.cmake_version }}
      is_release:
        description: "Whether this run is on a version tag"
        value: ${{ jobs.resolve.outputs.is_release }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  resolve:
    name: 🔍 Resolve version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.set.outputs.version }}
      cmake_version: ${{ steps.set.outputs.cmake_version }}
      is_release: ${{ steps.set.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve version
        id: set
        run: |
          set -e
          CMAKE_VERSION=$(grep -Po "VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+" CMakeLists.txt)
          echo "cmake_version=${CMAKE_VERSION}" >> "$GITHUB_OUTPUT"

          IS_RELEASE=false
          VERSION="${CMAKE_VERSION}-dev-${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
              IS_RELEASE=true
              if [ "${VERSION}" != "${CMAKE_VERSION}" ]; then
                echo "::warning::Tag version (${VERSION}) does not match CMakeLists.txt (${CMAKE_VERSION}). The tag wins for artifact naming."
              fi
            fi
          fi

          echo "version=${VERSION}"        >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}"  >> "$GITHUB_OUTPUT"
          echo "Resolved: version=${VERSION} cmake_version=${CMAKE_VERSION} is_release=${IS_RELEASE}"
