name: ⛏️  Lotus GPU Miner Build

# Builds the Rust-based GPU miner for both NVIDIA (CUDA/OpenCL) and AMD
# (ROCm/OpenCL) variants, and produces:
#   - per-arch tarballs/zips for direct download
#   - multi-arch Docker images on ghcr.io/<owner>/lotus-gpu-miner
#
# NVIDIA variant: linux/amd64 (Jetson arm64 deferred — needs openssl
#   sysroot for the aarch64 cross; see Dockerfile.lotus-gpu-miner header)
# AMD ROCm variant: linux/amd64 only (ROCm has no upstream arm64 wheels)

on:
  workflow_call:
    inputs:
      version:
        description: "The version to build"
        required: true
        type: string

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

jobs:
  binaries:
    name: 🔥 Binary / ${{ matrix.variant }}-${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            arch: amd64
            dockerfile: dockerfiles/Dockerfile.lotus-gpu-miner
            platform: linux/amd64
          - variant: amd
            arch: amd64
            dockerfile: dockerfiles/Dockerfile.lotus-gpu-miner-amd
            platform: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (single-arch, --load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          tags: lotus-gpu-miner-${{ matrix.variant }}-${{ matrix.arch }}:ci
          load: true
          cache-from: type=gha,scope=gpu-miner-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=gpu-miner-${{ matrix.variant }}-${{ matrix.arch }},mode=max

      - name: Extract binary + kernels
        run: |
          set -e
          mkdir -p artifacts
          DIR="lotus-gpu-miner-${{ matrix.variant }}-${{ inputs.version }}-linux-${{ matrix.arch }}"
          mkdir -p "artifacts/${DIR}"

          CID=$(docker create --platform=${{ matrix.platform }} lotus-gpu-miner-${{ matrix.variant }}-${{ matrix.arch }}:ci)
          # Primary binary lives at /opt/lotus/bin/lotus-miner-cli with a
          # lotus-gpu-miner symlink in the same directory.
          docker cp "$CID":/opt/lotus/bin/lotus-miner-cli "artifacts/${DIR}/" || \
            docker cp "$CID":/opt/lotus/bin/lotus-gpu-miner "artifacts/${DIR}/"
          # Optional kernels directory (for OpenCL variants).
          docker cp "$CID":/opt/lotus/kernels "artifacts/${DIR}/kernels" 2>/dev/null || true
          docker rm "$CID"

          # Make sure both invocation names exist.
          (cd "artifacts/${DIR}" && \
            if [ -f lotus-miner-cli ] && [ ! -e lotus-gpu-miner ]; then ln -sf lotus-miner-cli lotus-gpu-miner; fi && \
            if [ -f lotus-gpu-miner ] && [ ! -e lotus-miner-cli ]; then ln -sf lotus-gpu-miner lotus-miner-cli; fi)

          (cd artifacts && \
            tar -czf "${DIR}.tar.gz" "${DIR}" && \
            zip -r "${DIR}.zip" "${DIR}")
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: lotus-gpu-miner-${{ matrix.variant }}-linux-${{ matrix.arch }}-${{ inputs.version }}
          path: |
            artifacts/lotus-gpu-miner-${{ matrix.variant }}-${{ inputs.version }}-linux-${{ matrix.arch }}.tar.gz
            artifacts/lotus-gpu-miner-${{ matrix.variant }}-${{ inputs.version }}-linux-${{ matrix.arch }}.zip
          retention-days: 14

  docker-manifest:
    name: 🐳 Docker manifest / ${{ matrix.variant }}
    runs-on: ubuntu-22.04
    needs: binaries
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: nvidia
            image: lotus-gpu-miner
            dockerfile: dockerfiles/Dockerfile.lotus-gpu-miner
            platforms: linux/amd64
          - variant: amd
            image: lotus-gpu-miner-amd
            dockerfile: dockerfiles/Dockerfile.lotus-gpu-miner-amd
            platforms: linux/amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set repository owner (lowercase)
        run: echo "REPO_OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build & push manifest
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image }}:${{ inputs.version }}
            ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image }}:sha-${{ github.sha }}
            ghcr.io/${{ env.REPO_OWNER_LC }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=gpu-miner-${{ matrix.variant }}-manifest
          cache-to: type=gha,scope=gpu-miner-${{ matrix.variant }}-manifest,mode=max
          provenance: false
